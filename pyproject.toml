[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Karcytics"
version = "2.0.1"
description = "High-performance molecular data processing and analysis tool — Open Source, Free and Accessible to all."
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
authors = [
    { name = "Karcytics Contributors" },
]
keywords = ["biology", "image-analysis", "western-blot", "densitometry", "gel-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "karcytics-sdk>=2.0.0",
    "msgpack>=1.0.0",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9",
    "matplotlib==3.11.0",
    "pandas==3.0.3",
    "openpyxl>=3.1",
    # Core Utils
    "psutil>=6.0",
    "requests>=2.31",
    "cryptography>=50.0.0",
    "markdown",
    "pygments",
    "tifffile",
    "certifi",
    "pyobjc-framework-cocoa>=12.2.1 ; sys_platform == 'darwin'",
    "sentry-sdk>=2.68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "mypy>=1.9",
    "pip-audit>=2.7.0",
    "types-requests",
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pyinstaller",
    "coverage",
]

[project.scripts]
karcytics = "karcytics.__main__:main"
karcytics-sign = "karcytics.core.sign_plugin:main"

[project.urls]
Homepage = "https://github.com/KalaimaranB/Karcytics"
Documentation = "https://github.com/KalaimaranB/Karcytics#readme"
Repository = "https://github.com/KalaimaranB/Karcytics"
Issues = "https://github.com/KalaimaranB/Karcytics/issues"

[tool.setuptools.packages.find]
include = ["karcytics*"]
exclude = ["tests*", "test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "D", "UP", "B", "SIM", 
    "N", "A", "ARG", "RET", "C4", "C90", 
    "PLR0904", "PLR0913", "PLR0915"
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501", "E402", "PLR0915", "PLR0913", "ARG"]
"tests/**/*.py" = ["D", "E501", "E402", "PLR0915", "PLR0913", "ARG"]
"karcytics/ui/**/*.py" = ["D", "E501", "C90", "PLR"]
"karcytics/plugins/**/*.py" = ["D", "E501", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["karcytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests for core functionality",
    "integration: integration tests",
    "slow: slow running tests",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "numpy.*",
    "scipy.*",
    "cv2.*",
    "skimage.*",
    "pandas.*",
    "torch.*",
    "torchvision.*",
    "matplotlib.*",
    "openpyxl.*",
    "cellpose.*",
    "llama_cpp.*",
    "pytest.*",
    "certifi.*",
    "cryptography.*",
    "karcytics_sdk.*",
    "karcytics_sdk",
    "umap.*",
    "seaborn.*",
    "requests.*",
    "requests",
    "sentry_sdk.*",
    "sentry_sdk"
]
ignore_missing_imports = true



[[tool.mypy.overrides]]
module = "karcytics.ui.*"
ignore_errors = true

[tool.uv.sources]
karcytics-sdk = { path = "../Karcytics-SDK", editable = true }

[tool.pyright]
exclude = [
    "**/__pyrefly_virtual__",
    "**/node_modules",
    "**/__pycache__"
]
