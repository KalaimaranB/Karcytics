site_name: Karcytics™ Documentation
site_url: https://kalaimaranb.github.io/Karcytics
site_description: A biological analysis tool, free for academic and personal use.
site_author: Karcytics Contributors

repo_name: Karcytics
repo_url: https://github.com/KalaimaranB/Karcytics

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - content.code.annotate
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdocstrings

nav:
  - "Welcome": index.md
  - "User Manuals":
    - "User Guide Hub": user/01_User_Guide.md
    - "Installation": user/06_Installation.md
    - "Getting Started": user/02_Getting_Started.md
    - "Tutorial: First Analysis": user/03_Tutorial_First_Analysis.md
    - "Cyto Academy & Startup Guide": user/08_Cyto_Academy.md
    - "Project Management": user/04_Project_Management.md
    - "Plugin Store & Security": user/07_Plugin_Store_and_Security.md
    - "Security and Trust Architecture": user/10_Security_and_Trust.md
    - "FAQ & Troubleshooting": user/05_FAQ_Troubleshooting.md
  - "Internal Architecture":
    - "Core Architecture": internal/11_Core_Nervous_System.md
    - "Lifecycle Project Management": internal/12_LifeCycle_Project_Management.md
    - "State and History Management": internal/13_The_Time_Machine_Engine.md
    - "Performance and Scaling": internal/14_High_Performance_Scaling.md
    - "Dynamic Plugin Internals": internal/15_Dynamic_Plugin_Internals.md
    - "Module Manager & Plugin Contract": internal/15_ModuleManager_and_PluginContract.md
    - "API Reference (Auto)": internal/16_API_Reference_Auto.md
    - "PluginBase & SDK Contract": internal/16_PluginBase_and_SDK_Contract.md
    - "AI Assistant": internal/17_AI_Assistant.md
    - "Testing Philosophy": internal/18_Testing_Philosophy.md
    - "Developer Onboarding Guide": internal/19_Developer_Onboarding.md
    - "Security and Signing Guide": internal/20_Security_and_Signing.md
    - "Supply Chain Security": internal/21_Supply_Chain_Security.md
    - "Plugin Documentation Kit": internal/22_Plugin_Documentation.md
    - "Git Branching Engine": internal/23_Git_Branching_Engine.md
    - "Plugin Communication Protocol": internal/24_Plugin_Communication_Protocol.md
    - "Core & SDK Boundary": internal/25_Core_and_SDK_Boundary.md
    - "Server/Client Lifecycle": internal/26_Server_Client_Lifecycle.md
    - "The Academy Engine": internal/27_Academy_Engine.md
    - "Event Bridging": internal/28_Event_Bridging.md
