name: Karcytics CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Version Check & Build/Release Prep (Fast Path Entry Point)
  check-version:
    name: Version Verification
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
      version: ${{ steps.version-check.outputs.version }}
      prerelease: ${{ steps.version-check.outputs.prerelease }}
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 1

      - name: Version Check
        id: version-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
          TAG="v$NEW_VERSION"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          if [[ "$NEW_VERSION" =~ [a-zA-Z] ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            # A version only "ships" once a GitHub Release for its tag actually exists.
            # Checking existence (instead of diffing pyproject.toml against the parent
            # commit) means a promotion that fails build/test can be retried by simply
            # pushing a fix at the SAME version — no artificial patch bump required just
            # to get CI to try again. An already-shipped tag is still left alone.
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "Release $TAG already exists — nothing to build."
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Release $TAG not found — building."
            fi
          else
            # On PRs or manual dispatch, set appropriate release flags
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  # Job 1b: Enforce branch topology and Conventional Commits PR titles.
  # This is a hard gate, not a lint suggestion — it's a required status check on
  # both develop and main branch protection, so an out-of-policy PR cannot merge.
  enforce-workflow:
    name: Enforce Branch & Commit Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add X'. Got: $PR_TITLE"
            exit 1
          fi

      - name: Validate branch topology
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ] && [[ "$HEAD_REF" != hotfix/* ]]; then
              echo "::error::main only accepts PRs from 'develop' or 'hotfix/*'. Got: $HEAD_REF"
              exit 1
            fi
          elif [ "$BASE_REF" = "develop" ]; then
            if ! [[ "$HEAD_REF" =~ ^(feature|fix|chore|docs|hotfix|ci)/ ]]; then
              echo "::error::develop only accepts feature/fix/chore/docs/hotfix/ci branches. Got: $HEAD_REF"
              exit 1
            fi
          fi

  # Job 2: Low-cost linting and security audit (Fail-fast)
  audit-and-lint:
    name: Security Audit & Lints (Ubuntu)
    needs: [check-version]
    if: |
      success() &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       needs.check-version.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v4"

      - name: Checkout SDK
        uses: "actions/checkout@v4"
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK-temp

      - name: Position SDK
        run: mv Karcytics-SDK-temp ../Karcytics-SDK

      - name: Set up uv and Python
        uses: "astral-sh/setup-uv@v5"
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linting & Security Tools
        run: |
          if [ ! -d ".venv" ]; then uv venv; fi
          uv pip install ruff mypy pip-audit types-requests types-Markdown types-Pygments types-psutil requests markdown Pygments psutil

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter
        run: ruff format --check .

      - name: Run Mypy Type Checker
        run: mypy --explicit-package-bases karcytics tests

      - name: Security Vulnerability Scan
        run: |
          uv export --format requirements-txt --no-emit-project | grep -v "^-e " | grep -v "Karcytics-SDK" > reqs.txt
          pip-audit -r reqs.txt --no-deps --disable-pip --ignore-vuln CVE-2025-69872

      - name: Install System UI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 \
               libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
               libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libnss3 libnspr4 libatk1.0-0 \
               libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
               libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install Test Dependencies
        run: |
          if [ ! -d ".venv" ]; then uv venv; fi
          uv pip install pytest pytest-qt pytest-cov

      - name: Run Tests with Coverage
        run: |
          uv run pytest tests/core/ tests/sdk/ tests/test_boot.py tests/test_sanity.py \
            tests/test_resources.py tests/test_sdk_events.py tests/test_sdk_docs.py \
            --tb=short -q \
            --cov=karcytics --cov-report=xml --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"



  # Job 3: Cross-platform tests
  # Only runs against main (the develop -> main promotion path) or manual dispatch —
  # develop-targeted PRs get audit-and-lint's ubuntu tests only, to keep day-to-day
  # feature work cheap. The full macOS/Windows matrix is reserved for the promotion gate.
  test:
    name: Run Tests (${{ matrix.os }})
    needs: [check-version, audit-and-lint]
    if: |
      success() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.base_ref == 'main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["macos-latest", "windows-latest"]
        python-version: ["3.12"]
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v4"

      - name: Checkout SDK
        uses: "actions/checkout@v4"
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK-temp

      - name: Position SDK
        run: mv Karcytics-SDK-temp ../Karcytics-SDK

      - name: Set up uv and Python
        uses: "astral-sh/setup-uv@v5"
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install pytest pytest-qt pytest-cov
          uv pip install --no-deps -e .

      # Using shell: bash guarantees multi-line backslash continuation works perfectly on Windows!
      - name: Run Core & SDK Tests
        shell: bash
        run: |
          uv run pytest tests/core/ tests/sdk/ tests/test_boot.py tests/test_sanity.py \
            tests/test_resources.py tests/test_sdk_events.py tests/test_sdk_docs.py \
            --tb=short -q \
            --cov=karcytics --cov-report=xml --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"

  # Job 4: Expensive Production Executable Compilation (macOS + Windows)
  build:
    name: Production Build (${{ matrix.os }})
    needs: [check-version, audit-and-lint]
    if: |
      always() &&
      (needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.audit-and-lint.result == 'success' || needs.audit-and-lint.result == 'skipped')
    runs-on: ${{ matrix.os }}
    # Defense in depth for the E2E smoke test steps below: both branches of
    # _run_smoke_test now resolve deterministically within ~15-45s (success
    # or failure) rather than being able to hang forever the way the
    # pre-isolation-aware version could, but this still bounds the whole job
    # (PyInstaller build included) well under GitHub's 360-minute default so
    # a future regression of that shape fails loudly instead of burning a
    # full runner-hours budget silently.
    timeout-minutes: 45
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    env:
      SOURCE_DATE_EPOCH: 0
      PYTHONHASHSEED: 0
      KARCYTICS_SENTRY_DSN: ${{ secrets.KARCYTICS_SENTRY_DSN }}
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: Checkout SDK
        uses: "actions/checkout@v4"
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK-temp

      - name: Position SDK
        run: mv Karcytics-SDK-temp ../Karcytics-SDK

      - name: Set SOURCE_DATE_EPOCH
        shell: bash
        run: |
          EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> $GITHUB_ENV

      - name: Set up uv and Python
        uses: "astral-sh/setup-uv@v5"
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install pyinstaller pytest

      - name: Run Supply Chain Integrity Check
        run: uv run pytest tests/core/test_supply_chain.py

      - name: Run PyInstaller Build
        run: uv run pyinstaller Karcytics.spec

      - name: Run E2E Smoke Test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/Karcytics.app/Contents/MacOS/Karcytics --smoke-test flow_cytometry karcytics/tutorials/assets/demo_tutorial.fcs

      - name: Run E2E Smoke Test (Windows)
        if: runner.os == 'Windows'
        run: .\dist\Karcytics\Karcytics.exe --smoke-test flow_cytometry karcytics/tutorials/assets/demo_tutorial.fcs

      - name: Compress Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path Karcytics\* -DestinationPath Karcytics-Windows.zip

      - name: Compress Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          tar -czf Karcytics-macOS.tar.gz Karcytics.app

      - name: Generate SBOM
        shell: bash
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          uv run python -c "from karcytics.core.sbom import SBOMGenerator; print(SBOMGenerator().to_json())" > dist/sbom.json

      - name: Generate Checksum
        shell: bash
        run: |
          shopt -s nullglob
          cd dist

          if [ ! -f sbom.json ]; then
            echo "::error::dist/sbom.json is missing — the 'Generate SBOM' step must have failed silently."
            ls -la
            exit 1
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            HASH_CMD="sha256sum"
          else
            HASH_CMD="shasum -a 256"
          fi

          # HASH_CMD is deliberately unquoted below: on macOS (no sha256sum)
          # it's the two-word "shasum -a 256", and quoting it would pass
          # that as a single, nonexistent command name (exit 127).
          $HASH_CMD sbom.json > sbom.json.sha256

          archives=(*.tar.gz *.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No .tar.gz or .zip archive found in dist/ to checksum."
            ls -la
            exit 1
          fi
          for f in "${archives[@]}"; do
            $HASH_CMD "$f" > "$f.sha256"
          done

      - name: Upload Artifacts
        uses: "actions/upload-artifact@v4"
        with:
          name: Karcytics-Executable-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/sbom.json
            dist/*.sha256

  # Job 4b: Self-published core registry metadata (feeds the in-app update banner)
  generate-registry:
    name: Generate Registry Metadata
    needs: [check-version]
    if: |
      always() &&
      (needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: Generate registry.json
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            NOTES="- Initial release"
          fi
          python3 - "$VERSION" "$NOTES" <<'EOF'
          import json
          import sys
          import datetime

          version, notes = sys.argv[1], sys.argv[2]
          data = {
              "version": version.lstrip("v"),
              "download_url": "https://github.com/KalaimaranB/Karcytics/releases/latest",
              "notes": notes,
              "release_date": datetime.date.today().isoformat(),
          }
          with open("registry.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Upload Registry Artifact
        uses: "actions/upload-artifact@v4"
        with:
          name: registry-json
          path: registry.json

  # Job 5: Hash Collection
  collect-hashes:
    name: Collect Artifact Hashes
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: "actions/download-artifact@v4"
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Multi-Platform Hashes
        id: hashes
        run: |
          cd artifacts
          echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

  # Job 6: SLSA Provenance Generation (SLSA Level 3)
  provenance:
    needs: [collect-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: "slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0"
    with:
      base64-subjects: "${{ needs.collect-hashes.outputs.hashes }}"
      upload-assets: true

  # Job 7: Push GitHub Release
  release:
    name: Create GitHub Release
    needs: [check-version, build, provenance, test, generate-registry]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: "actions/download-artifact@v4"
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: "softprops/action-gh-release@v2"
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Karcytics ${{ needs.check-version.outputs.version }}
          body: |
            ## Karcytics ${{ needs.check-version.outputs.version }}

            An open-source platform for biological data analysis and visualization, built around a modular plugin architecture for reproducible lab workflows.

            ### 📦 Install
            New here? Start with the [Installation Guide](https://kalaimaranb.github.io/Karcytics/user/06_Installation/).

            - **macOS**: download `Karcytics-macOS.tar.gz`, extract, drag `Karcytics.app` into Applications.
            - **Windows**: download `Karcytics-Windows.zip`, extract, run `Karcytics.exe`.

            ### 🛡️ Security & Supply Chain
            Every release ships cryptographic attestations to verify what you're running:
            - **Checksums** — verify the download itself: `shasum -a 256 -c Karcytics-macOS.tar.gz.sha256` (swap in the Windows filename as needed).
            - **SBOM** (`sbom.json`) — full dependency manifest: `shasum -a 256 -c sbom.json.sha256`.
            - **SLSA Provenance** (`*.intoto.jsonl`) — cryptographic proof of build origin: `slsa-verifier verify-artifact Karcytics-macOS.tar.gz --provenance-path multiple.intoto.jsonl --source-uri github.com/KalaimaranB/Karcytics`.

            ### 📝 What's Changed
            See the auto-generated changelog below. Found a bug? [Open an issue](https://github.com/KalaimaranB/Karcytics/issues).
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release_artifacts/*.zip
            release_artifacts/*.tar.gz
            release_artifacts/sbom.json
            release_artifacts/*.sha256
            release_artifacts/*.intoto.jsonl
            release_artifacts/registry.json
