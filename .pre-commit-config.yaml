fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-linter
        name: Ruff Linter
        entry: uv run ruff check . --fix
        language: system
        types_or: [python, markdown, jupyter]
        pass_filenames: false
        always_run: true

      - id: ruff-formatter
        name: Ruff Formatter
        entry: uv run ruff format .
        language: system
        types_or: [python, markdown, jupyter]
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Mypy Type Checker
        entry: uv run mypy --explicit-package-bases karcytics tests
        language: system
        pass_filenames: false

      - id: pip-audit
        name: Dependency Security Audit
        entry: bash -c 'uv export --format requirements-txt --no-emit-project | grep -v "^-e " > reqs.txt && uv run --with pip-audit pip-audit -r reqs.txt --no-deps --disable-pip --ignore-vuln CVE-2025-69872'
        language: system
        pass_filenames: false

      - id: license-compliance
        name: License Compliance Check
        entry: uv run python scripts/check_license_compliance.py
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest Test Suite
        entry: env QT_QPA_PLATFORM=offscreen uv run python -m pytest tests/core/ tests/sdk/ tests/test_boot.py tests/test_sanity.py tests/test_resources.py tests/test_sdk_events.py tests/test_sdk_docs.py --tb=short -q --cov=karcytics --cov-report=term-missing
        language: system
        pass_filenames: false

      - id: sbom-validation
        name: Validate SBOM Generator
        entry: env PYTHONPATH=. uv run python -c "from karcytics.core.sbom import SBOMGenerator; SBOMGenerator().to_json()"
        language: system
        pass_filenames: false

      - id: conventional-commit-msg
        name: Conventional Commit Message
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
